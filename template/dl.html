<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{HEADING}} | iMovies Download</title>
    <link rel="icon" href="https://img.icons8.com/fluency/96/download.png" type="image/png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-surface: #111827;
            --bg-card: #161f30;
            --bg-card-hover: #1e293b;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(59, 130, 246, 0.3);
            --primary: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --accent-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Glow */
        .ambient-glow {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 70vw;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 75%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(11, 15, 25, 0.85);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .brand-title {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
        }

        .nav-btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-highlight);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .nav-btn-primary {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .nav-btn-primary:hover {
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.45);
            transform: translateY(-1px);
        }

        /* Container */
        .main-container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            width: 100%;
            margin: auto;
            padding: 2.5rem 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Download Card */
        .download-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            margin-bottom: 2rem;
        }

        .file-icon-box {
            width: 90px;
            height: 90px;
            border-radius: 24px;
            background: var(--primary-gradient);
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }

        .file-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            word-break: break-word;
            line-height: 1.4;
        }

        .meta-badges {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.4rem 0.85rem;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .badge-pill i {
            color: var(--primary);
        }

        /* Action Buttons */
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 450px;
            margin: 0 auto;
        }

        .btn-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 1.75rem;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
        }

        .btn-download {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-download:hover {
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.55);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .btn-copy {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
        }

        .btn-copy:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-highlight);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 9999;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Footer */
        .footer {
            background: rgba(11, 15, 25, 0.95);
            border-top: 1px solid var(--border-subtle);
            padding: 2rem 1.5rem;
            text-align: center;
            margin-top: auto;
        }

        .footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .footer-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--primary);
        }

        .footer-copy {
            color: var(--text-dim);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <!-- Navigation Header -->
    <header class="navbar">
        <a href="https://t.me/imoviesmagic" class="brand-link" target="_blank">
            <div class="brand-icon">
                <i class="fa-solid fa-cloud-arrow-down"></i>
            </div>
            <div>
                <span class="brand-title">iMovies</span>
                <span class="brand-badge">Download</span>
            </div>
        </a>

        <div class="nav-actions">
            <a href="https://t.me/imoviesmagic" target="_blank" class="nav-btn nav-btn-secondary">
                <i class="fa-brands fa-telegram"></i>
                <span>Updates Channel</span>
            </a>
            <a href="https://t.me/+t6AsfQHAiqM2NDM1" target="_blank" class="nav-btn nav-btn-primary">
                <i class="fa-solid fa-users"></i>
                <span>Movie Group</span>
            </a>
        </div>
    </header>

    <main class="main-container">
        <div class="download-card">
            <div class="file-icon-box">
                <i class="fa-solid fa-file-video"></i>
            </div>

            <h1 class="file-name">{{FILE_NAME}}</h1>

            <div class="meta-badges">
                <div class="badge-pill">
                    <i class="fa-solid fa-hard-drive"></i>
                    <span>Size: {{FILE_SIZE}}</span>
                </div>
                <div class="badge-pill">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Unlimited Speed</span>
                </div>
                <div class="badge-pill">
                    <i class="fa-solid fa-shield-check"></i>
                    <span>Verified File</span>
                </div>
            </div>

            <div class="btn-stack">
                <a href="{{SRC}}" class="btn-main btn-download" download>
                    <i class="fa-solid fa-download"></i>
                    <span>Download File</span>
                </a>
                <button class="btn-main btn-copy" onclick="copyDownloadUrl('{{SRC}}')">
                    <i class="fa-regular fa-copy"></i>
                    <span>Copy Download Link</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast">
        <i class="fa-solid fa-check-circle" style="color: #10b981;"></i>
        <span id="toastMessage">Download link copied!</span>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-links">
            <a href="https://t.me/imoviesmagic" target="_blank" class="footer-link">
                <i class="fa-brands fa-telegram"></i> Updates Channel
            </a>
            <a href="https://t.me/+t6AsfQHAiqM2NDM1" target="_blank" class="footer-link">
                <i class="fa-solid fa-comments"></i> Movie Discussion Group
            </a>
        </div>
        <p class="footer-copy">© 2026 iMovies Magic • Ultra-Fast Stream & Download Engine</p>
    </footer>

    <script>
        function copyDownloadUrl(url) {
            const fullUrl = url.startsWith('http') ? url : window.location.origin + url;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(fullUrl).then(() => {
                    showToast('Direct download URL copied to clipboard!');
                }).catch(() => {
                    fallbackCopy(fullUrl);
                });
            } else {
                fallbackCopy(fullUrl);
            }
        }

        function fallbackCopy(text) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast('Direct download URL copied to clipboard!');
            } catch (err) {
                prompt('Copy this download URL:', text);
            }
            document.body.removeChild(tempInput);
        }

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
